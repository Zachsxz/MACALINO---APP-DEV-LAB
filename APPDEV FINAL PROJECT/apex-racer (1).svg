NOTE ON EMAIL CONFIRMATION:
If your hosting account does not have SMTP configured, PHP's mail()
function may not actually deliver the email. As a fallback for testing,
the registration success screen also displays the confirmation link
directly on screen so you can click it manually without needing a
working mail server. For the actual submission/demo, we recommend
configuring the host's SMTP (many free hosts like InfinityFree provide
one) so the professor can see a real email arrive.
